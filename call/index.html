<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="呼ぶ">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>体交コール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* Layout: one-screen bedside panel. A single "くるしい" button fills the screen so one switch press always hits it; alarm takes over the whole screen. */
:root {
  --bg: #eef2f3;
  --surface: #ffffff;
  --fg: #1b2a30;
  --muted: #5b6d73;
  --line: #cdd8db;
  --call: #3d4f8f;
  --call-fg: #ffffff;
  --calm: #1f6f78;
  --calm-fg: #ffffff;
  --alarm-a: #c62828;
  --alarm-b: #ffcf33;
  --focus: #ff9f1a;
  --font-display: "Zen Maru Gothic", "BIZ UDPGothic", "Hiragino Maru Gothic ProN", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171a; --surface: #172327; --fg: #e4eef0; --muted: #93a7ad; --line: #2a3a3f;
    --call: #5266b0; --calm: #2a8c96; --alarm-a: #b71c1c; --alarm-b: #e6a700;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171a; --surface: #172327; --fg: #e4eef0; --muted: #93a7ad; --line: #2a3a3f;
  --call: #5266b0; --calm: #2a8c96; --alarm-a: #b71c1c; --alarm-b: #e6a700;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
}
button { font: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 6px solid var(--focus); outline-offset: 4px; }

/* start screen */
.start { flex: 1; display: grid; place-content: center; gap: 22px; text-align: center; max-width: 34rem; margin: 0 auto; }
.start h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(2.2rem, 6vw, 3.4rem); margin: 0; text-wrap: balance; }
.start p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.8; }
.start ul { text-align: left; margin: 0; padding-left: 1.2em; color: var(--muted); line-height: 1.9; font-size: .98rem; }
.btn-start { background: var(--calm); color: var(--calm-fg); font-family: var(--font-display); font-weight: 900; font-size: 1.7rem; padding: 26px 20px; border-radius: 18px; }
.btn-sub { background: transparent; color: var(--fg); border: 2px solid var(--line); padding: 14px; border-radius: 14px; font-size: 1.05rem; }

/* the one button */
.call {
  flex: 1; min-height: 0; border-radius: 30px;
  background: var(--call); color: var(--call-fg);
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2vh;
  font-family: var(--font-display); font-weight: 900; line-height: 1.05;
  box-shadow: inset 0 -10px 0 rgba(0,0,0,.2);
  transition: transform .08s;
}
.call:active { transform: scale(.99); }
.call .big { font-size: clamp(4rem, 22vw, 15rem); letter-spacing: .08em; text-align: center; }
.call .small { font-family: var(--font-body); font-weight: 700; font-size: clamp(1.1rem, 2.6vw, 1.7rem); opacity: .92; }

/* status strip: plain text, so Switch Control never stops on it */
.status {
  display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 16px; font-size: clamp(.95rem, 2vw, 1.15rem);
}
.status b { font-variant-numeric: tabular-nums; }
.status .label { color: var(--muted); font-size: .85em; letter-spacing: .04em; margin-right: 6px; }
.status .times { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }

/* alarm */
.alarm {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--alarm-a); color: #ffffff; text-align: center;
  animation: flash 1s steps(1) infinite;
}
@keyframes flash { 50% { background: var(--alarm-b); color: #1b1b1b; } }
@media (prefers-reduced-motion: reduce) { .alarm { animation: none; } }
.alarm .what { font-family: var(--font-display); font-weight: 900; font-size: clamp(2.6rem, 12vw, 9rem); line-height: 1.05; }
.alarm .sub { font-size: clamp(1.2rem, 3.4vw, 2.2rem); font-weight: 700; text-wrap: balance; }
.alarm .when { font-size: clamp(1rem, 2.6vw, 1.6rem); font-variant-numeric: tabular-nums; font-weight: 700; }
.btn-stop {
  position: relative; overflow: hidden; -webkit-touch-callout: none; touch-action: none;
  background: #ffffff; color: #1b1b1b; border-radius: 22px;
  padding: 24px 40px; font-family: var(--font-display); font-weight: 900; font-size: clamp(1.5rem, 3.6vw, 2.4rem);
  box-shadow: 0 10px 0 rgba(0,0,0,.25);
}
.btn-stop .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: #ffcf33; }
.btn-stop .lbl { position: relative; }
.note { color: var(--muted); font-size: .85rem; text-align: center; margin: 0; }
</style>
</head>
<body>

<div class="app" id="app">
  <section class="start" id="start">
    <h1>体交コール</h1>
    <p>スイッチ1回で、呼び出しの音が鳴ります。<br>音は「とめる」を押すまで鳴りつづけます。</p>
    <ul>
      <li>iPadの音量は最大に</li>
      <li>設定 → 画面表示 → 自動ロック「なし」</li>
      <li>アクセスガイドでこの画面に固定</li>
      <li>体交の前に、スイッチが左手から外れない位置か確認</li>
      <li>音をとめるのは「長おし」。本人のスイッチで止まらないようにしています</li>
    </ul>
    <button class="btn-start" id="btnStart" type="button">はじめる</button>
    <button class="btn-sub" id="btnTest" type="button">音をためす（2秒）</button>
  </section>

  <button class="call" id="btnCall" type="button" hidden>
    <span class="big">呼ぶ</span><span class="small">押すと音が鳴ります</span>
  </button>
  <div class="status" id="status" hidden aria-hidden="true">
    <span><span class="label">今日のコール</span><b id="count">0回</b></span>
    <span class="times" id="times"></span>
  </div>
  <p class="note" id="note" hidden aria-hidden="true">記録はこのiPadの中だけに残ります。訪問看護さんに見せる用</p>
</div>

<div class="alarm" id="alarm" hidden role="alertdialog" aria-labelledby="alarmWhat">
  <div class="what" id="alarmWhat">呼んでいます</div>
  <div class="sub">いったん手を止めて<br>顔を見てください</div>
  <div class="when" id="alarmWhen">いま</div>
  <button class="btn-stop" id="btnStop" type="button"><span class="fill" id="stopFill"></span><span class="lbl">長おしで とめる</span></button>
</div>

<script>
(function () {
  // urgent fast triple beep, repeating
  var PATTERN = [[1175,.12],[0,.06],[1175,.12],[0,.06],[1175,.12],[0,.06],[880,.3],[0,.3]];

  try { if ("audioSession" in navigator) navigator.audioSession.type = "playback"; } catch (e) {}

  function makeWav(pattern) {
    var rate = 22050, samples = [];
    pattern.forEach(function (seg) {
      var f = seg[0], n = Math.floor(seg[1] * rate);
      for (var i = 0; i < n; i++) {
        if (!f) { samples.push(0); continue; }
        var t = i / rate, env = Math.min(1, i / 200, (n - i) / 200);
        var s = Math.sin(2*Math.PI*f*t)*0.65 + Math.sin(2*Math.PI*f*2*t)*0.2 + Math.sin(2*Math.PI*f*3*t)*0.1;
        samples.push(s * env * 0.95);
      }
    });
    var buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
    function str(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    str(0,"RIFF"); v.setUint32(4,36+samples.length*2,true); str(8,"WAVE");
    str(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    str(36,"data"); v.setUint32(40,samples.length*2,true);
    for (var i = 0; i < samples.length; i++) v.setInt16(44+i*2, Math.max(-1, Math.min(1, samples[i])) * 32767, true);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  var player = new Audio(makeWav(PATTERN));
  player.loop = true; player.preload = "auto";

  function unlockAudio() {
    player.muted = true;
    var p = player.play();
    var done = function () { player.pause(); player.currentTime = 0; player.muted = false; };
    if (p && p.then) p.then(done).catch(function () { player.muted = false; }); else done();
  }
  function stopSound() { player.pause(); player.currentTime = 0; }

  var started = false;
  function keepAwake() {
    try { if ("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(function () {}); } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && started) keepAwake(); });

  // log of call times (this device only)
  var calls = [];
  try { calls = JSON.parse(localStorage.getItem("kurushii-log") || "[]") || []; } catch (e) { calls = []; }
  function saveLog() { try { localStorage.setItem("kurushii-log", JSON.stringify(calls.slice(-200))); } catch (e) {} }

  function hm(ts) { var d = new Date(ts); return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function renderStatus() {
    var start = new Date(); start.setHours(0, 0, 0, 0);
    var today = calls.filter(function (c) { return c.at >= start.getTime(); });
    $("count").textContent = today.length + "回";
    $("times").textContent = today.slice(-6).map(function (c) {
      return hm(c.at) + (c.wait != null ? "（" + c.wait + "秒で対応）" : "");
    }).join("　");
  }

  var $ = function (id) { return document.getElementById(id); };
  var calledAt = 0, tick = null;

  $("btnTest").addEventListener("click", function () {
    player.currentTime = 0; player.play().catch(function () {});
    setTimeout(stopSound, 2000);
  });

  $("btnStart").addEventListener("click", function () {
    unlockAudio(); keepAwake(); started = true;
    $("start").hidden = true; $("btnCall").hidden = false; $("status").hidden = false; $("note").hidden = false;
    renderStatus();
    setInterval(renderStatus, 60000);
  });

  $("btnCall").addEventListener("click", function () {
    calledAt = Date.now();
    calls.push({ at: calledAt, wait: null }); saveLog();
    $("alarmWhen").textContent = hm(calledAt) + " にコール";
    $("alarm").hidden = false;
    player.currentTime = 0; player.play().catch(function () {});
    clearInterval(tick);
    tick = setInterval(function () {
      var s = Math.floor((Date.now() - calledAt) / 1000);
      $("alarmWhen").textContent = hm(calledAt) + " にコール ・ " + (s < 60 ? s + "秒" : Math.floor(s/60) + "分" + (s%60) + "秒") + "経過";
    }, 1000);
    $("app").inert = true;
  });

  // stop needs a 1.5s hold, so a Switch Control tap (the patient's switch) can't silence it
  var HOLD = 1500, holdTimer = null, holdStart = 0, raf = null;
  function holdFrame() {
    var r = Math.min(1, (Date.now() - holdStart) / HOLD);
    $("stopFill").style.width = (r * 100) + "%";
    if (r < 1) raf = requestAnimationFrame(holdFrame);
  }
  function holdCancel() { clearTimeout(holdTimer); cancelAnimationFrame(raf); $("stopFill").style.width = "0"; }
  $("btnStop").addEventListener("pointerdown", function (e) {
    e.preventDefault(); holdStart = Date.now(); holdFrame();
    holdTimer = setTimeout(function () { holdCancel(); stopAlarm(); }, HOLD);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { $("btnStop").addEventListener(ev, holdCancel); });
  $("btnStop").addEventListener("contextmenu", function (e) { e.preventDefault(); });

  function stopAlarm() {
    stopSound(); clearInterval(tick);
    var last = calls[calls.length - 1];
    if (last && last.at === calledAt) { last.wait = Math.round((Date.now() - calledAt) / 1000); saveLog(); }
    $("alarm").hidden = true; $("app").inert = false; renderStatus();
  }
})();
</script>
</body></html>
